---
# $yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json

notify:
  - if: 'build.branch =~ /^((main)|([0-9]+\.[0-9]+))\$/ && (build.state == "failed" || pipeline.started_passing)'
    slack:
      channels:
        - "#search-et-alerts"
      message: "${BUILDKITE_MESSAGE}"

steps:
  - label: "🔨 Run e2e test"
    key: "e2e_test"
    agents:
      provider: aws
      instanceType: t3.medium
      imagePrefix: core-amazonlinux-2023
    command: ".buildkite/run_test.sh"

  - label: "🔨 Run FIPS e2e test"
    key: "fips_e2e_test"
    agents:
      provider: aws
      instanceType: t3.medium
      imagePrefix: core-amazonlinux-2023
    command: ".buildkite/run_fips_test.sh"

  - label: ":whale: Build and publish docker image"
    if: 'build.branch =~ /^((main)|([0-9]+\.[0-9]+))\$/'
    depends_on:
      - "e2e_test"
      - "fips_e2e_test"
    agents:
      image: "docker.elastic.co/ci-agent-images/drivah:0.30.1@sha256:111c247ae608d7a99cfae0521eb77f2a603ce87da60f07292a35d50b3f5bf503"
    command: "scripts/build-and-publish-docker-image.sh --push"
